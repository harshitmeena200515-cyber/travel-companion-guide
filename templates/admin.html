<!DOCTYPE html>
<html lang="hi" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travele — Administrator Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: rgba(21, 29, 49, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #3b82f6;
            --accent: #10b981;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 32px;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.3rem; font-weight: 700; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 36px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }
        .stat-val { font-size: 2rem; font-weight: 800; color: var(--primary); margin-top: 8px; }
        .section-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .section-card h2 { font-size: 1.15rem; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: rgba(255,255,255,0.05); color: var(--text); border-color: var(--border); }
        .btn-danger { background: rgba(239,68,68,0.2); color: #f87171; border-color: rgba(239,68,68,0.3); }
        .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
        .badge-admin { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .badge-user { background: rgba(16,185,129,0.2); color: #34d399; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <span>🛡️</span>
                <span>Travele Admin Portal</span>
            </div>
            <div style="display: flex; gap: 12px;">
                <a href="/" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Return to App</a>
                <button onclick="logoutAdmin()" class="btn btn-danger"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div style="color: var(--text-muted); font-size: 0.85rem;"><i class="fa-solid fa-users"></i> Total Registered Users</div>
                <div class="stat-val" id="totalUsers">1</div>
            </div>
            <div class="stat-card">
                <div style="color: var(--text-muted); font-size: 0.85rem;"><i class="fa-solid fa-heart"></i> Total Saved Destinations</div>
                <div class="stat-val" id="totalFavs">0</div>
            </div>
            <div class="stat-card">
                <div style="color: var(--text-muted); font-size: 0.85rem;"><i class="fa-solid fa-shield-halved"></i> Security Status</div>
                <div class="stat-val" style="color: var(--accent); font-size: 1.4rem; padding-top: 6px;">Protected</div>
            </div>
            <div class="stat-card">
                <div style="color: var(--text-muted); font-size: 0.85rem;"><i class="fa-solid fa-server"></i> API Connectivity</div>
                <div class="stat-val" style="color: var(--accent); font-size: 1.4rem; padding-top: 6px;">Online (100%)</div>
            </div>
        </div>

        <div class="section-card">
            <h2><i class="fa-solid fa-user-shield"></i> User Accounts & Privileges</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Role</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="usersTableBody">
                    <tr>
                        <td>1</td>
                        <td>admin (Harshit Meena)</td>
                        <td><span class="badge badge-admin">SUPER ADMIN</span></td>
                        <td>Initial Setup</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadStats() {
            try {
                const res = await fetch('/api/admin/stats');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('totalUsers').textContent = data.total_users || 1;
                    document.getElementById('totalFavs').textContent = data.total_favorites || 0;
                    if (data.users && data.users.length) {
                        const tbody = document.getElementById('usersTableBody');
                        tbody.innerHTML = data.users.map(u => `
                            <tr>
                                <td>${u.id}</td>
                                <td><strong>${u.username}</strong></td>
                                <td><span class="badge ${u.role === 'admin' ? 'badge-admin' : 'badge-user'}">${u.role.toUpperCase()}</span></td>
                                <td>${u.created_at || 'Recently'}</td>
                            </tr>
                        `).join('');
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function logoutAdmin() {
            await fetch('/api/auth/logout', { method: 'POST' });
            window.location.href = '/';
        }

        loadStats();
    </script>
</body>
</html>
